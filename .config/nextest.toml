# A test that hangs is reported and stopped instead of blocking the run: slow after 60 s,
# terminated after three periods.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }

# GitHub Actions (NEXTEST_PROFILE=ci): run every test so one run reports all failures.
[profile.ci]
slow-timeout = { period = "60s", terminate-after = 3 }
fail-fast = false
failure-output = "immediate-final"
