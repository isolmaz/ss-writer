name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  NEXTEST_PROFILE: ci

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: fmt, clippy, docs-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # README.md is optional until the first release; once it exists the check is strict
      # (every feature in docs/features.toml needs a README line).
      - name: Docs sync (spec, keymap, features, README, Fluent ids)
        run: cargo xtask docs-check ${{ hashFiles('README.md') != '' && '--strict' || '' }}

  test:
    name: tests (nextest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Tests
        run: cargo nextest run --workspace --all-features --locked
      - name: Doc tests
        run: cargo test --workspace --doc --all-features --locked

  coverage:
    name: coverage gate (100 % lines, regions, functions)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Coverage
        run: cargo xtask coverage
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            lcov.info
            target/coverage-summary.txt
          if-no-files-found: ignore
