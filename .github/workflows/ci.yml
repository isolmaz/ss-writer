name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  NEXTEST_PROFILE: ci

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: fmt, clippy, docs-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # A red run still saves its cache: without it every failing run recompiles the
          # whole dependency graph (28 of the coverage job's 35 minutes went there).
          cache-on-failure: true
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Strict: every feature in docs/features.toml needs a README line.
      - name: Docs sync (spec, keymap, features, README, Fluent ids)
        run: cargo xtask docs-check --strict
      # Coverage cannot see this: a widget's own tests cover it while no user path reaches it.
      - name: Wiring (every UI module is reachable from the application)
        run: cargo xtask wiring

  test:
    name: tests (nextest)
    # The cheap gate first: a run that does not compile cleanly must not spend a runner hour
    # on the suite and the coverage gate.
    needs: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # A red run still saves its cache: without it every failing run recompiles the
          # whole dependency graph (28 of the coverage job's 35 minutes went there).
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Desktop like Windows 11 (screen, animations, long temp paths)
        shell: pwsh
        run: .github/scripts/desktop.ps1
      - name: Tests
        run: cargo nextest run --workspace --all-features --locked
      - name: Doc tests
        run: cargo test --workspace --doc --all-features --locked

  coverage:
    name: coverage gate (100 % lines, regions, functions)
    needs: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # A red run still saves its cache: without it every failing run recompiles the
          # whole dependency graph (28 of the coverage job's 35 minutes went there).
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Desktop like Windows 11 (screen, animations, long temp paths)
        shell: pwsh
        run: .github/scripts/desktop.ps1
      - name: Coverage
        run: cargo xtask coverage
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            lcov.info
            target/coverage-summary.txt
            target/coverage-uncovered.txt
          if-no-files-found: ignore
