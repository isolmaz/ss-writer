name: Mutants

# Mutation testing runs on GitHub, never on a developer machine, over the code that changed: the
# weekly run since the last commit older than seven days, a run started by hand since the commit
# or tag it names. The mutants are split into shards of 50 (a mutant of ssw-app takes up to about
# five minutes to build and test, a job may run six hours), at most 256, GitHub's limit; the
# whole workspace (about 31 000 mutants) does not fit. The report of every shard is kept as an
# artifact.
on:
  workflow_dispatch:
    inputs:
      base:
        description: "Test the code changed since this commit or tag"
        required: true
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: bash

jobs:
  scope:
    name: scope
    runs-on: windows-latest
    outputs:
      base: ${{ steps.scope.outputs.base }}
      shards: ${{ steps.scope.outputs.shards }}
      total: ${{ steps.scope.outputs.total }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Mutants to test and shards
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ inputs.base }}
        run: |
          if [ "$EVENT" = schedule ]; then
            BASE=$(git rev-list -1 --before="7 days ago" HEAD)
          fi
          BASE=$(git rev-parse --verify "$BASE^{commit}")
          git diff "$BASE" HEAD -- crates > mutants.diff
          count=$(cargo mutants --list --workspace --exclude 'xtask/**' --in-diff mutants.diff | wc -l)
          total=$(( (count + 49) / 50 ))
          echo "$count mutants since $BASE, $total shards"
          if [ "$total" -gt 256 ]; then
            echo "::error::$count mutants need more than 256 shards; name a later commit"
            exit 1
          fi
          {
            echo "base=$BASE"
            echo "total=$total"
            echo "shards=[$(seq -s, 0 $((total - 1)))]"
          } >> "$GITHUB_OUTPUT"

  mutants:
    name: mutants (shard ${{ matrix.shard }}/${{ needs.scope.outputs.total }})
    needs: scope
    if: needs.scope.outputs.total != '0'
    runs-on: windows-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,cargo-nextest
      - name: Desktop like Windows 11 (screen, animations, long temp paths)
        shell: pwsh
        run: .github/scripts/desktop.ps1
      - name: Mutants
        env:
          BASE: ${{ needs.scope.outputs.base }}
          SHARD: ${{ matrix.shard }}/${{ needs.scope.outputs.total }}
        run: |
          git diff "$BASE" HEAD -- crates > mutants.diff
          cargo xtask mutants -j 2 -- --shard "$SHARD" --all-features --timeout 600 --in-diff mutants.diff
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: |
            target/mutants-report.md
            target/mutants.out
          if-no-files-found: ignore
