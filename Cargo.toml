[workspace]
resolver = "3"
members = [
    "crates/ssw-core",
    "crates/ssw-io",
    "crates/ssw-convert",
    "crates/ssw-render",
    "crates/ssw-ui",
    "crates/ssw-win",
    "crates/ssw-app",
    "crates/ssw-preview",
    "xtask",
]
# Vendored upstream code is a path dependency, not a workspace member: it keeps its own
# lints and test suite (see third_party/mermaid-rs-renderer/FIXES.md).
exclude = ["third_party/mermaid-rs-renderer"]

[workspace.package]
version = "0.1.8"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/isolmaz/ss-writer"
authors = ["isolmaz <info@isolmaz.com>"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
# Lists of byte ranges with one element are normal here (selections, match ranges).
single_range_in_vec_init = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "unwind"

# Dependencies (Typst, the Mermaid renderer, image codecs) are optimized in dev and test builds:
# debug builds of them are slow enough to exceed the renderers' time limits under load.
[profile.dev.package."*"]
opt-level = 2
