<?xml version="1.0" encoding="UTF-8"?>
<!--
  SS Writer application icon (master). `cargo xtask icons` rasterizes this file into app.ico
  (16, 20, 24, 32, 40, 48, 64 and 256 px); edit this file, regenerate, commit both.

  Design: a blue page with a folded corner, a bold white S monogram and a pen nib resting on
  the lower right corner. Accent #1874D3 with a light top and a dark bottom for depth.
  Shapes only (no <text>), so rendering never depends on installed fonts.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#52A8F5"/>
      <stop offset="0.55" stop-color="#1874D3"/>
      <stop offset="1" stop-color="#0E559F"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#BFDDFB" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9E2FB"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#06274D" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Page -->
  <path filter="url(#lift)" fill="url(#page)"
        d="M64 24H152L208 80V216A16 16 0 0 1 192 232H64A16 16 0 0 1 48 216V40A16 16 0 0 1 64 24Z"/>
  <!-- Folded corner -->
  <path fill="url(#flap)" d="M152 24V64A16 16 0 0 0 168 80H208Z"/>

  <!-- S monogram -->
  <path fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"
        d="M156 112C148 100 112 96 104 118C96 140 160 144 152 174C144 204 108 196 100 182"/>

  <!-- Pen nib: tip at the lower left, grip towards the upper right -->
  <g filter="url(#lift)">
    <g transform="translate(166 216) rotate(45) scale(0.8)">
      <rect x="-15" y="-118" width="30" height="46" rx="8" fill="#0B3B78"/>
      <path fill="url(#nib)" stroke="#0B3B78" stroke-width="6" stroke-linejoin="round"
            d="M0 0L-11 -22C-24 -44 -24 -60 -13 -74H13C24 -60 24 -44 11 -22Z"/>
      <path fill="none" stroke="#0B3B78" stroke-width="5" stroke-linecap="round" d="M0 -8V-46"/>
      <circle cx="0" cy="-52" r="6" fill="#0B3B78"/>
    </g>
  </g>
</svg>
