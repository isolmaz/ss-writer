[package]
name = "ssw-app"
description = "SS Writer application binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
build = "build.rs"

[lib]
name = "ssw_app"
path = "src/lib.rs"

[[bin]]
name = "SSWriter"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Tests only: lets `ssw_win::fault::arm` make the n-th checked system call of `ssw-win` fail, to
# reach the error arms of the platform wiring (`ui::platform`).
fault-injection = ["ssw-win/fault-injection"]

[dependencies]
ssw-core = { path = "../ssw-core" }
ssw-io = { path = "../ssw-io" }
ssw-convert = { path = "../ssw-convert" }
ssw-render = { path = "../ssw-render" }
ssw-ui = { path = "../ssw-ui" }
ssw-win = { path = "../ssw-win" }
serde_json = "1"
thiserror = "2"
# Message numbers and handle types of the window glue (`ui::window`, `ui::platform`); every
# call into the OS goes through `ssw-win`.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# `ssw_win::testing::PrivateDesktop`: the tests that really show and raise windows run on a
# desktop of their own (the same crate as above, with the test support switched on).
ssw-win = { path = "../ssw-win", features = ["test-support"] }
tempfile = "3"
# Decodes the PNG pages of the dark-theme export tests (the version and features `ssw-render` uses).
image = { version = "0.25", default-features = false, features = ["png"] }
# A second connection to the state database that breaks it, for the failed-purge test of
# `autosave` (the same version and feature as `ssw-io`).
rusqlite = { version = "0.40", features = ["bundled"] }
# `TBPFLAG` of the recording taskbar double in `tests/ui_window.rs`; the named mutex that keeps
# the tests of the user's spelling dictionary apart (`ui::platform` tests).
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_System_Threading"] }
