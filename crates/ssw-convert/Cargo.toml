[package]
name = "ssw-convert"
description = "Import and export between Markdown and other document formats."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ssw-core = { path = "../ssw-core" }
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
cfb = "0.15"
encoding_rs = "0.8"
base64 = "0.22"
epub-builder = "0.8"
html5ever = "0.35"
markup5ever_rcdom = "0.35"

[dev-dependencies]
tempfile = "3"
