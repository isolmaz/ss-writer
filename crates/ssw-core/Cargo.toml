[package]
name = "ssw-core"
description = "Platform-neutral document model, Markdown parsing, editing and commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# `unicode_lines` is disabled on purpose: only `\n` (and `\r\n`) end a line, never VT/FF/NEL/LS/PS/lone CR.
ropey = { version = "1.6", default-features = false, features = ["simd"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
fluent-bundle = "0.16"
unic-langid = "0.9"
smallvec = "1"

[dev-dependencies]
proptest = "1.11"
