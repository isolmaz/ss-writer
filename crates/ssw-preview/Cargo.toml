[package]
name = "ssw-preview"
description = "Explorer preview handler for Markdown files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
# Tests only: lets `fault::arm` make the n-th checked platform call fail (see src/fault.rs), and
# `ssw_win::fault::arm_with` make a call of the platform layer fail with a given code (a lost
# graphics device).
fault-injection = ["ssw-win/fault-injection"]

[dependencies]
ssw-core = { path = "../ssw-core" }
ssw-render = { path = "../ssw-render" }
ssw-ui = { path = "../ssw-ui" }
ssw-win = { path = "../ssw-win" }
thiserror = "2"
# `#[implement]` expands to `::windows_core` paths.
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
