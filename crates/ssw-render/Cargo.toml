[package]
name = "ssw-render"
description = "Typst-backed math, Mermaid diagrams, vector scenes and paged export."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ssw-core = { path = "../ssw-core" }
thiserror = "2"
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
typst-render = "=0.15.1"
typst-svg = "=0.15.1"
mitex = "0.2.4"
usvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
mermaid-rs-renderer = { version = "0.3.1", path = "../../third_party/mermaid-rs-renderer" }
comemo = "0.5"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
