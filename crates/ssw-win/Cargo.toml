[package]
name = "ssw-win"
description = "Win32 platform layer: window, Direct2D, DirectWrite, TSF, UIA."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ssw-core = { path = "../ssw-core" }
ssw-ui = { path = "../ssw-ui" }
ssw-render = { path = "../ssw-render" }
thiserror = "2"
# `IIterable` for the storage items of the share sheet's `DataPackage`.
windows-collections = "0.3"
windows-core = "0.62"
windows-numerics = "0.3"
windows = { version = "0.62", features = [
    "ApplicationModel_DataTransfer",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectManipulation",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Imaging_D2D",
    "Win32_Graphics_Printing",
    "Win32_NetworkManagement_WNet",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Opc",
    "Win32_Storage_Xps",
    "Win32_Storage_Xps_Printing",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Search",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Accessibility",
    "Win32_UI_Animation",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Input_Touch",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Reads the XPS packages (OPC zip files) the print tests produce.
zip = { version = "9", default-features = false, features = ["deflate"] }
# Rasterizes the Typst page a formula scene was made from: the reference of the scene renderer
# pixel tests (same version as ssw-render's).
typst-render = "=0.15.1"
