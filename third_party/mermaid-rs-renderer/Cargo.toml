[package]
name = "mermaid-rs-renderer"
version = "0.3.1"
edition = "2024"
description = "mermaid-rs-renderer 0.3.1 vendored for SS Writer (library only: no CLI, no PNG output) with local fixes; see FIXES.md."
license = "MIT"
repository = "https://github.com/1jehuang/mermaid-rs-renderer"
publish = false

[lib]
name = "mermaid_rs_renderer"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
fontdb = "0.23"
json5 = "1.3"
once_cell = "1.21.4"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ttf-parser = "0.25"
